<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>How Peri decides</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#55624A"/>
    </marker>
  </defs>
  <rect width="860" height="250" rx="18" fill="#FFF8EC"/>

  <g fill="none" stroke="#55624A" stroke-width="2" marker-end="url(#arrow)">
    <path d="M168 126H194"/>
    <path d="M362 126H426"/>
    <path d="M281 98C281 62 306 44 346 44H634"/>
    <path d="M281 154C281 190 306 208 346 208H634"/>
    <path d="M598 114C620 114 618 64 634 64"/>
    <path d="M598 138C620 138 618 188 634 188"/>
  </g>

  <g font-size="12.5" font-style="italic" fill="#55624A" text-anchor="middle" stroke="#FFF8EC" stroke-width="5" paint-order="stroke">
    <text x="394" y="118">doubtful</text>
    <text x="470" y="37">clearly fine</text>
    <text x="470" y="201">clearly a scam</text>
  </g>

  <g text-anchor="middle">
    <rect x="14" y="98" width="154" height="56" rx="14" fill="#FFFFFF" stroke="#D8CCB2" stroke-width="1.5"/>
    <text x="91" y="121" font-size="15" font-weight="600" fill="#1F2A1A">📩 A message</text>
    <text x="91" y="141" font-size="15" font-weight="600" fill="#1F2A1A">or a call</text>

    <rect x="200" y="98" width="162" height="56" rx="14" fill="#E8F3DC" stroke="#25541A" stroke-width="2"/>
    <text x="281" y="121" font-size="15" font-weight="700" fill="#1F2A1A">Rules on the phone</text>
    <text x="281" y="140" font-size="12" fill="#3F4D39">offline · hard rules first</text>

    <rect x="432" y="98" width="166" height="56" rx="14" fill="#E3EEFF" stroke="#0467DF" stroke-width="2"/>
    <text x="515" y="121" font-size="15" font-weight="700" fill="#0B2A5B">Muse Spark Open</text>
    <text x="515" y="140" font-size="12" fill="#0B2A5B">+ investigator · vote ±2</text>

    <rect x="640" y="20" width="206" height="52" rx="26" fill="#E8F3DC" stroke="#2E7D32" stroke-width="2"/>
    <text x="743" y="51" font-size="15" font-weight="700" fill="#1F2A1A">😊 Peri stays quiet</text>

    <rect x="640" y="176" width="206" height="60" rx="28" fill="#FDE7E3" stroke="#9C1F17" stroke-width="2"/>
    <text x="743" y="201" font-size="15" font-weight="700" fill="#5A120D">☂️ Peri warns</text>
    <text x="743" y="221" font-size="12" fill="#5A120D">risky actions wait for the family</text>
  </g>
</svg>
